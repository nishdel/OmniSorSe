name: Native release packaging
run-name: Native package validation v${{ inputs.version }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character main commit to package
        required: true
      version:
        description: Exact source product version, including any prerelease label
        required: true
        default: 2.13.0-rc

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  release-validation:
    name: Validate exact release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_revision: ${{ steps.source.outputs.sha }}
      base_version: ${{ steps.inputs.outputs.base_version }}
    steps:
      - name: Validate packaging inputs
        id: inputs
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
          PACKAGE_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo "Native packaging must be dispatched from main, not '$WORKFLOW_REF'." >&2
            exit 2
          fi
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'The packaging ref must be an exact 40-character commit.' >&2
            exit 2
          fi
          if [[ "${SOURCE_REF,,}" != "${WORKFLOW_SHA,,}" ]]; then
            echo "Requested source '$SOURCE_REF' is not the dispatched main commit '$WORKFLOW_SHA'." >&2
            exit 2
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'The package version must be a filename-safe semantic version.' >&2
            exit 2
          fi
          echo "base_version=${PACKAGE_VERSION%%-*}" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact source identity
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "${sha,,}" != "${SOURCE_REF,,}" ]]; then
            echo "Checked out '$sha' instead of exact requested commit '$SOURCE_REF'." >&2
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${sha,,}" != "${remote_main,,}" ]]; then
            echo "Requested source '$sha' is no longer the live origin/main commit '$remote_main'." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Match package version to source authority
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          [xml] $properties = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          $versionNodes = @($properties.SelectNodes('/Project/PropertyGroup/OmniSorSeVersion'))
          if ($versionNodes.Count -ne 1) {
            throw "Directory.Build.props must define exactly one OmniSorSeVersion authority; found $($versionNodes.Count)."
          }
          $sourceVersion = $versionNodes[0].InnerText.Trim()
          if ($sourceVersion -ne $env:PACKAGE_VERSION) {
            throw "Requested package version '$env:PACKAGE_VERSION' does not match source version '$sourceVersion'."
          }

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore without cache
        run: dotnet restore OpenSorSe.sln --force --no-cache

      - name: Build and test authoritative Release metadata
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          BASE_VERSION: ${{ steps.inputs.outputs.base_version }}
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          dotnet build OpenSorSe.sln --configuration Release --no-restore "-p:OmniSorSeVersion=$PACKAGE_VERSION" "-p:OmniSorSeFileVersion=$BASE_VERSION.0" "-p:SourceRevisionId=$SOURCE_REVISION" -p:ContinuousIntegrationBuild=true
          dotnet test OpenSorSe.sln --configuration Release --no-build --no-restore

      - name: Run release architecture and recovery gates
        run: dotnet test tests/OpenSorSe.Core.Tests/OpenSorSe.Core.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~RepositoryDocumentationTests

      - name: Audit direct and transitive NuGet vulnerabilities
        shell: pwsh
        run: |
          dotnet list OpenSorSe.sln package --vulnerable --include-transitive --format json | Set-Content -LiteralPath vulnerability-audit.json
          $audit = Get-Content -Raw -LiteralPath vulnerability-audit.json | ConvertFrom-Json
          $vulnerabilities = @($audit.projects.frameworks.topLevelPackages.vulnerabilities) + @($audit.projects.frameworks.transitivePackages.vulnerabilities)
          if (@($vulnerabilities | Where-Object { $null -ne $_ }).Count -ne 0) {
            throw 'NuGet vulnerability audit found one or more vulnerable packages.'
          }

  windows:
    name: Windows x64 portable and installer
    needs: release-validation
    runs-on: windows-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore Windows runtime graph
        run: dotnet restore OpenSorSe.sln --runtime win-x64 --force --no-cache

      - name: Locate maintained Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($compiler) -or
              -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'The maintained runner does not provide Inno Setup 6; refusing mutable fallback installation.'
          }
          Write-Host "Using $((Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion) at $compiler"
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build Windows artifacts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ needs.release-validation.outputs.source_revision }}
        run: ./eng/release/Build-WindowsArtifacts.ps1 -Version $env:PACKAGE_VERSION -SourceRevision $env:SOURCE_REVISION -OutputDirectory '.artifacts/release' -InnoSetupCompiler "$env:INNO_SETUP_COMPILER"

      - name: Install, start, stop, and uninstall package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ needs.release-validation.outputs.source_revision }}
        run: ./eng/release/Validate-WindowsArtifacts.ps1 -Version $env:PACKAGE_VERSION -SourceRevision $env:SOURCE_REVISION -ArtifactDirectory '.artifacts/release'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OmniSorSe-v${{ inputs.version }}-windows-package
          path: |
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64.zip
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.suffix }} DMG
    needs: release-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            suffix: x64
          - runner: macos-15
            rid: osx-arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore macOS runtime graph
        run: dotnet restore OpenSorSe.sln --runtime '${{ matrix.rid }}' --force --no-cache

      - name: Build native app bundle and disk image
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
          SOURCE_REVISION: ${{ needs.release-validation.outputs.source_revision }}
        run: bash ./eng/release/Build-MacArtifacts.sh "$PACKAGE_VERSION" "$RUNTIME_IDENTIFIER" '.artifacts/release' "$SOURCE_REVISION"

      - name: Inspect, mount, and smoke-test disk image
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
          SOURCE_REVISION: ${{ needs.release-validation.outputs.source_revision }}
        run: bash ./eng/release/Validate-MacArtifact.sh "$PACKAGE_VERSION" "$RUNTIME_IDENTIFIER" '.artifacts/release' "$SOURCE_REVISION"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OmniSorSe-v${{ inputs.version }}-macos-${{ matrix.suffix }}-package
          path: .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-${{ matrix.suffix }}.dmg
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Assemble and verify release checksums
    needs:
      - release-validation
      - windows
      - macos
    runs-on: windows-latest
    steps:
      - name: Check out checksum tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: 'OmniSorSe-v${{ inputs.version }}-*-package'
          path: .artifacts/release
          merge-multiple: true

      - name: Generate source-bound CycloneDX dependency SBOM
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ needs.release-validation.outputs.source_revision }}
        run: ./eng/release/New-ReleaseSbom.ps1 -Version $env:PACKAGE_VERSION -SourceRevision $env:SOURCE_REVISION -ArtifactDirectory '.artifacts/release'

      - name: Generate and verify SHA-256 checksums
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./eng/release/New-ReleaseChecksums.ps1 -Version $env:PACKAGE_VERSION -ArtifactDirectory '.artifacts/release'

      - name: Upload complete verified package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OmniSorSe-v${{ inputs.version }}-package-bundle
          path: |
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64.zip
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64-setup.exe
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-x64.dmg
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-arm64.dmg
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-sbom.cdx.json
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
