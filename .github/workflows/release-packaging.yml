name: Native release packaging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact main commit or annotated release tag to package
        required: true
      version:
        description: Three-part product version
        required: true
        default: 2.11.0

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  release-validation:
    name: Validate exact release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_revision: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact source identity
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore without cache
        run: dotnet restore OpenSorSe.sln --force --no-cache

      - name: Build and test authoritative Release metadata
        run: |
          dotnet build OpenSorSe.sln --configuration Release --no-restore -p:OmniSorSeVersion='${{ inputs.version }}' -p:OmniSorSeFileVersion='${{ inputs.version }}.0' -p:SourceRevisionId='${{ steps.source.outputs.sha }}' -p:ContinuousIntegrationBuild=true
          dotnet test OpenSorSe.sln --configuration Release --no-build --no-restore

      - name: Run release architecture and recovery gates
        run: dotnet test tests/OpenSorSe.Core.Tests/OpenSorSe.Core.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~RepositoryDocumentationTests

      - name: Audit direct and transitive NuGet vulnerabilities
        shell: pwsh
        run: |
          dotnet list OpenSorSe.sln package --vulnerable --include-transitive --format json | Set-Content -LiteralPath vulnerability-audit.json
          $audit = Get-Content -Raw -LiteralPath vulnerability-audit.json | ConvertFrom-Json
          $vulnerabilities = @($audit.projects.frameworks.topLevelPackages.vulnerabilities) + @($audit.projects.frameworks.transitivePackages.vulnerabilities)
          if (@($vulnerabilities | Where-Object { $null -ne $_ }).Count -ne 0) {
            throw 'NuGet vulnerability audit found one or more vulnerable packages.'
          }

  windows:
    name: Windows x64 portable and installer
    needs: release-validation
    runs-on: windows-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore Windows runtime graph
        run: dotnet restore OpenSorSe.sln --runtime win-x64 --force --no-cache

      - name: Locate maintained Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup 6 is unavailable."
          }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build Windows artifacts
        shell: pwsh
        run: ./eng/release/Build-WindowsArtifacts.ps1 -Version '${{ inputs.version }}' -SourceRevision '${{ needs.release-validation.outputs.source_revision }}' -OutputDirectory '.artifacts/release' -InnoSetupCompiler "$env:INNO_SETUP_COMPILER"

      - name: Install, start, stop, and uninstall package
        shell: pwsh
        run: ./eng/release/Validate-WindowsArtifacts.ps1 -Version '${{ inputs.version }}' -SourceRevision '${{ needs.release-validation.outputs.source_revision }}' -ArtifactDirectory '.artifacts/release'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release
          path: |
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64.zip
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.suffix }} DMG
    needs: release-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            suffix: x64
          - runner: macos-15
            rid: osx-arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore macOS runtime graph
        run: dotnet restore OpenSorSe.sln --runtime '${{ matrix.rid }}' --force --no-cache

      - name: Build native app bundle and disk image
        run: bash ./eng/release/Build-MacArtifacts.sh '${{ inputs.version }}' '${{ matrix.rid }}' '.artifacts/release' '${{ needs.release-validation.outputs.source_revision }}'

      - name: Inspect, mount, and smoke-test disk image
        run: bash ./eng/release/Validate-MacArtifact.sh '${{ inputs.version }}' '${{ matrix.rid }}' '.artifacts/release' '${{ needs.release-validation.outputs.source_revision }}'

      - name: Upload macOS disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.suffix }}-release
          path: .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-${{ matrix.suffix }}.dmg
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Assemble and verify release checksums
    needs:
      - release-validation
      - windows
      - macos
    runs-on: windows-latest
    steps:
      - name: Check out checksum tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-release'
          path: .artifacts/release
          merge-multiple: true

      - name: Generate source-bound CycloneDX dependency SBOM
        shell: pwsh
        run: ./eng/release/New-ReleaseSbom.ps1 -Version '${{ inputs.version }}' -SourceRevision '${{ needs.release-validation.outputs.source_revision }}' -ArtifactDirectory '.artifacts/release'

      - name: Generate and independently verify SHA-256 checksums
        shell: pwsh
        run: ./eng/release/New-ReleaseChecksums.ps1 -Version '${{ inputs.version }}' -ArtifactDirectory '.artifacts/release'

      - name: Upload complete verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OmniSorSe-v${{ inputs.version }}-release-bundle
          path: |
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64.zip
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-win-x64-setup.exe
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-x64.dmg
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-macos-arm64.dmg
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-sbom.cdx.json
            .artifacts/release/OmniSorSe-v${{ inputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
