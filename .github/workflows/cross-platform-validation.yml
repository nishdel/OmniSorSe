name: Cross-platform validation

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            host: OmniSorSe.exe
          - os: ubuntu-latest
            rid: linux-x64
            host: OmniSorSe
          - os: macos-15-intel
            rid: osx-x64
            host: OmniSorSe
          - os: macos-15
            rid: osx-arm64
            host: OmniSorSe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpenSorSe.sln

      - name: Build Debug
        run: dotnet build OpenSorSe.sln --configuration Debug --no-restore

      - name: Test Debug
        run: dotnet test OpenSorSe.sln --configuration Debug --no-build --no-restore --logger "trx;LogFilePrefix=debug" --results-directory .artifacts/test-results/${{ matrix.os }}/Debug

      - name: Build Release
        run: dotnet build OpenSorSe.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test OpenSorSe.sln --configuration Release --no-build --no-restore --logger "trx;LogFilePrefix=release" --results-directory .artifacts/test-results/${{ matrix.os }}/Release

      - name: Verify no tests were skipped
        shell: pwsh
        run: |
          $notExecuted = 0
          $files = Get-ChildItem -Path ".artifacts/test-results/${{ matrix.os }}" -Filter *.trx -Recurse
          if ($files.Count -eq 0) {
            throw "No TRX test results were produced."
          }
          foreach ($file in $files) {
            [xml]$result = Get-Content -Raw -LiteralPath $file.FullName
            $notExecuted += [int]$result.TestRun.ResultSummary.Counters.notExecuted
          }
          if ($notExecuted -ne 0) {
            throw "$notExecuted test(s) were skipped or not executed."
          }

      - name: Verify whitespace formatting
        run: dotnet format whitespace OpenSorSe.sln --verify-no-changes --no-restore

      - name: Verify code-style formatting
        run: dotnet format style OpenSorSe.sln --verify-no-changes --no-restore --severity warn

      - name: Verify analyzer formatting
        run: dotnet format analyzers OpenSorSe.sln --verify-no-changes --no-restore --severity warn

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Verify documentation and dependency policy
        run: dotnet test tests/OpenSorSe.Core.Tests/OpenSorSe.Core.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~RepositoryDocumentationTests

      - name: Audit direct and transitive NuGet vulnerabilities
        shell: pwsh
        run: |
          dotnet list OpenSorSe.sln package --vulnerable --include-transitive --format json | Set-Content -LiteralPath .artifacts/vulnerability-audit.json
          $audit = Get-Content -Raw -LiteralPath .artifacts/vulnerability-audit.json | ConvertFrom-Json
          $vulnerabilities = @($audit.projects.frameworks.topLevelPackages.vulnerabilities) + @($audit.projects.frameworks.transitivePackages.vulnerabilities)
          if (@($vulnerabilities | Where-Object { $null -ne $_ }).Count -ne 0) {
            throw 'NuGet vulnerability audit found one or more vulnerable packages.'
          }

      - name: Restore native runtime graph
        run: dotnet restore src/OpenSorSe.Desktop/OpenSorSe.Desktop.csproj --runtime '${{ matrix.rid }}' --force --no-cache

      - name: Publish and run native package smoke
        shell: pwsh
        run: |
          $publishRoot = [System.IO.Path]::GetFullPath(".artifacts/native-smoke/${{ matrix.rid }}/publish")
          $dataRoot = [System.IO.Path]::GetFullPath(".artifacts/native-smoke/${{ matrix.rid }}/profile")
          dotnet publish src/OpenSorSe.Desktop/OpenSorSe.Desktop.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true --no-restore --output $publishRoot -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'Native publish failed.' }
          $hostPath = Join-Path $publishRoot '${{ matrix.host }}'
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) { throw "Native host is missing: $hostPath" }
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $hostPath
          $startInfo.UseShellExecute = $false
          $startInfo.ArgumentList.Add('--package-smoke-test')
          $startInfo.ArgumentList.Add($dataRoot)
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if ($null -eq $process) { throw 'Native package smoke did not start.' }
          try {
            if (-not $process.WaitForExit(60000)) {
              if (-not $process.HasExited) { $process.Kill($true) }
              throw 'Native package smoke did not finish within 60 seconds.'
            }
            if ($process.ExitCode -ne 0) { throw "Native package smoke failed with exit code $($process.ExitCode)." }
          }
          finally {
            $process.Dispose()
          }
